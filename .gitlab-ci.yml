stages:
  - test
  - deploy

test:
  stage: test
  image: python:3.13-slim
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest
    # The API ships the compiled contract; fail if it is stale.
    - python -m app.cli compile --check

docker-build:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t dpp-api .

# A deploy creates a NEW registry with empty state, so it is manual. Set the
# NETWORK and DEPLOYER_PRIVATE_KEY CI/CD variables for the target environment.
deploy-registry:
  stage: deploy
  image: python:3.13-slim
  script:
    - pip install -r requirements.txt
    - python -m app.cli deploy --yes
  when: manual
  only:
    - main
    - prod
